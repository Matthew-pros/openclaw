    - name: Run ClawdBot with bash loop
      run: |
        echo "=== STARTING CLAWDBOT ==="
        echo "Node: $(node --version)"
        
        # Determine start command
        if [ -f "package.json" ]; then
          # Use jq to parse package.json (available on GitHub runners)
          START_CMD=$(jq -r '.scripts.start // "node index.js"' package.json)
        else
          START_CMD="node index.js"
        fi
        
        echo "Start command: $START_CMD"
        
        # Restart loop with counter
        RESTART_COUNT=0
        MAX_RESTARTS=50  # Prevents infinite loops
        
        while [ $RESTART_COUNT -lt $MAX_RESTARTS ]; do
          echo "[$(date)] 🤖 Starting bot (attempt $((RESTART_COUNT + 1)))..."
          
          # Run the bot
          eval $START_CMD
          EXIT_CODE=$?
          
          echo "[$(date)] ❌ Bot exited with code $EXIT_CODE"
          
          RESTART_COUNT=$((RESTART_COUNT + 1))
          
          if [ $RESTART_COUNT -ge $MAX_RESTARTS ]; then
            echo "⚠️ Maximum restart attempts reached"
            break
          fi
          
          echo "[$(date)] 🔄 Restarting in 10 seconds..."
          sleep 10
        done
        
        echo "🛑 Bot runner stopped"
      
      env:
        NODE_ENV: production

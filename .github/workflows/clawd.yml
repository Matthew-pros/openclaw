name: ClawdBot 24/7 Runner

on:
  # Spustí se při push do main větve
  push:
    branches: [ main, master ]
  
  # Spustí se při ručním triggeru z GitHub UI
  workflow_dispatch:
  
  # Naplánované spouštění každých 5 minut pro restart
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Strategie pro prevenci duplicitních běhů
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false  # false pro 24/7 běh
    
    # Omezení na maximálně 6 hodin (limit GitHub Actions)
    timeout-minutes: 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        # Pokud existuje package-lock.json, použij npm ci pro rychlejší instalaci
        if [ -f "package-lock.json" ]; then
          echo "Using npm ci for faster installation..."
          npm ci --no-audit --prefer-offline
        else
          echo "Using npm install..."
          npm install --no-audit --prefer-offline
          # Vytvoří package-lock.json pro příště
        fi
    
    - name: Create .env file
      run: |
        # Vytvoří .env soubor s tvými třemi tokeny
        echo "Creating .env file..."
        cat > .env <<EOF
        # Discord Bot Configuration
        DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
        
        # Telegram Bot Configuration  
        TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        
        # OpenRouter AI Configuration
        OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
        EOF
        
        # Bezpečnostní kontrola - nezobrazuje tokeny v logu
        echo ".env file created with 3 environment variables"
        echo "File size: $(wc -l < .env) lines"
    
    - name: Create keep-alive script
      run: |
        cat > keep_alive.js <<'EOF'
        // Keep-alive script pro ClawdBot
        const { exec } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        
        console.log('🚀 Starting ClawdBot 24/7...');
        console.log('📁 Current directory:', process.cwd());
        console.log('📦 Available files:', fs.readdirSync('.').join(', '));
        
        // Zkontroluj package.json pro startovací script
        let packageJson = {};
        try {
          packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          console.log('📄 Found package.json, scripts:', JSON.stringify(packageJson.scripts, null, 2));
        } catch (err) {
          console.log('⚠️  Could not read package.json:', err.message);
        }
        
        // Urči spouštěcí příkaz
        const startCommand = packageJson.scripts && packageJson.scripts.start 
          ? 'npm start' 
          : 'node index.js || node bot.js || node main.js || node src/index.js || node dist/index.js';
        
        console.log(`🎯 Using start command: ${startCommand}`);
        
        // Spuštění bota
        const botProcess = exec(startCommand, {
          stdio: 'pipe',
          shell: true,
          cwd: process.cwd()
        });
        
        // Logování s časovými značkami
        const logWithTime = (prefix, data) => {
          const timestamp = new Date().toISOString();
          const lines = data.toString().split('\n').filter(line => line.trim());
          lines.forEach(line => {
            console.log(`[${timestamp}] ${prefix} ${line}`);
          });
        };
        
        // Zachytávání stdout
        botProcess.stdout.on('data', (data) => {
          logWithTime('🤖', data);
          
          // Detekce běžných problémů pro automatický restart
          const message = data.toString().toLowerCase();
          if (message.includes('disconnected') || 
              message.includes('rate limit') ||
              message.includes('connection closed') ||
              message.includes('econnrefused') ||
              message.includes('failed to connect') ||
              message.includes('error') && !message.includes('success')) {
            console.log('⚠️  Detected potential issue, will monitor...');
          }
        });
        
        // Zachytávání stderr
        botProcess.stderr.on('data', (data) => {
          logWithTime('❌', data);
          
          // Kritické chyby - restart po 30 sekundách
          const errorMsg = data.toString().toLowerCase();
          if (errorMsg.includes('fatal') || 
              errorMsg.includes('unhandled rejection') ||
              errorMsg.includes('uncaught exception') ||
              errorMsg.includes('token invalid') ||
              errorMsg.includes('authentication failed')) {
            console.log('🚨 Critical error detected, scheduling restart in 30 seconds...');
            setTimeout(() => {
              console.log('♻️  Restarting due to critical error...');
              botProcess.kill('SIGTERM');
              process.exit(1);  // GitHub Actions restartuje workflow
            }, 30000);
          }
        });
        
        // Zpracování ukončení procesu
        botProcess.on('close', (code, signal) => {
          console.log(`🔴 Bot process exited with code ${code} and signal ${signal}`);
          
          // Restart strategie s exponenciálním backoffem
          const restartDelays = [5000, 10000, 30000, 60000]; // 5s, 10s, 30s, 60s
          const restartCount = parseInt(process.env.RESTART_COUNT || '0');
          const delay = restartDelays[Math.min(restartCount, restartDelays.length - 1)];
          
          console.log(`🔄 Restarting in ${delay/1000} seconds (attempt ${restartCount + 1})...`);
          
          setTimeout(() => {
            console.log('♻️  Attempting to restart bot...');
            process.exit(1);  // GitHub Actions restartuje workflow
          }, delay);
        });
        
        // Zachycení signálů pro čisté ukončení
        const shutdown = () => {
          console.log('🛑 Received shutdown signal, stopping bot...');
          botProcess.kill('SIGTERM');
          
          setTimeout(() => {
            if (botProcess.exitCode === null) {
              console.log('⚠️  Bot did not exit gracefully, forcing...');
              botProcess.kill('SIGKILL');
            }
            process.exit(0);
          }, 10000);
        };
        
        process.on('SIGTERM', shutdown);
        process.on('SIGINT', shutdown);
        
        // Pravidelný heartbeat každých 2 minuty
        setInterval(() => {
          const now = new Date();
          console.log(`💓 Heartbeat - ClawdBot running at ${now.toISOString()}`);
          
          // Zápis statusu pro monitoring
          fs.writeFileSync('/tmp/clawdbot_status.json', JSON.stringify({
            status: 'running',
            last_heartbeat: now.toISOString(),
            uptime: process.uptime(),
            memory: process.memoryUsage()
          }, null, 2));
        }, 120000);  // Každé 2 minuty
        
        console.log('✅ Keep-alive script initialized and running');
        EOF
    
    - name: Run ClawdBot
      run: |
        echo "🚀 Launching ClawdBot..."
        echo "Current directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
        # Spuštění bota s keep-alive
        node keep_alive.js
      
      env:
        # Nastav restart count pro exponenciální backoff
        RESTART_COUNT: 0
        NODE_ENV: production
        
        # Alternativně můžeme tokeny předat přímo (místo .env souboru):
        # DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        # TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    
    - name: Cleanup on failure
      if: failure()
      run: |
        echo "🧹 Cleaning up after failure..."
        # Zde můžeš přidat cleanup příkazy
        echo "Workflow failed - check logs above for details"
